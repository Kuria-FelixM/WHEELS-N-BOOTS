<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Partnership Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-light hero-contact">
    
    <div class="container py-5" >
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card shadow-lg">
                    <div class="card-header text-white text-center">
                        <h3 class="custom-h3">Partner with Us</h3>
                    </div>
                    <div class="card-body">
                        <form>
                            <div class="row">
                                <!-- Event Dropdown -->
                                <div class="mb-3">
                                    <label class="form-label">Upcoming Projects</label>
                                    <select class="form-select" required>
                                        <option selected disabled>Select a Project</option>
                                        <option value="everest_climb">Tour of the Stans</option>
                                        <option value="kilimanjaro_summit">County tour</option>
                                        <option value="andes_expedition">K2, The Ultimate Challenge</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row">
                                <!-- Left Column -->
                                <div class="col-md-6">
                                    <!-- Organization Name -->
                                    <div class="mb-3">
                                        <label class="form-label">Organization Name</label>
                                        <input type="text" class="form-control" placeholder="Enter Organization Name" required>
                                    </div>

                                    <!-- Contact Person -->
                                    <div class="mb-3">
                                        <label class="form-label">Contact Person</label>
                                        <input type="text" class="form-control" placeholder="Enter Contact Person Name" required>
                                    </div>

                                    <!-- Email -->
                                    <div class="mb-3">
                                        <label class="form-label">Email Address</label>
                                        <input type="email" class="form-control" placeholder="Enter Email" required>
                                    </div>

                                </div>

                                <!-- Right Column -->
                                <div class="col-md-6">
                                    <!-- Type of Partnership -->
                                    <div class="mb-3">
                                        <label class="form-label">Type of Partnership</label>
                                        <input type="text" class="form-control" placeholder="E.g., Sponsorship, Event Collaboration, Logistics Support" required>
                                    </div>

                                    

                                    <!-- Message -->
                                    <div class="mb-3">
                                        <label class="form-label">Message</label>
                                        <textarea class="form-control" rows="4" placeholder="Tell us why you'd like to partner with us..." required></textarea>
                                    </div>
                                </div>
                            </div>

                            <!-- Submit Button -->
                            <div class="text-center">
                                <button type="submit" class="btn btn-primary w-100">Submit Partnership Request</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
